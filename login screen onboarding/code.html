<body class="bg-background text-on-background min-h-screen relative overflow-hidden flex flex-col justify-between items-center px-container-padding py-section-margin">
<!-- Ambient Background Lighting -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute -top-32 -left-32 w-96 h-96 bg-primary-container/20 rounded-full blur-[100px]"></div>
<div class="absolute bottom-1/4 -right-32 w-[30rem] h-[30rem] bg-secondary-container/10 rounded-full blur-[120px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-md relative z-10 flex flex-col flex-grow justify-center items-center">
<!-- Hero/Logo Section -->
<div class="text-center mb-12 w-full flex flex-col items-center">
<h1 class="font-display-hero text-display-hero text-on-surface uppercase italic mb-2 tracking-tighter">TurfMatch</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto text-center">Enter the arena. Own the pitch. Premium access verified via OTP.</p>
</div>
<!-- Bento Box Form Container -->
<div class="w-full bg-surface-container/60 backdrop-blur-2xl rounded-xl p-8 border border-white/5 relative">
<span class="font-micro-label text-micro-label text-primary uppercase absolute top-4 left-6">Access Control</span>
<div class="mt-8 space-y-6 w-full">
<!-- Phone Input Field -->
<div class="relative w-full">
<label class="font-body-md text-body-md text-on-surface-variant block mb-2" for="phone">Mobile Number</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant">smartphone</span>
<input class="w-full bg-surface-container-high border-0 border-b-2 border-surface-container-highest focus:border-primary focus:ring-0 text-on-surface font-body-lg text-body-lg px-12 py-4 rounded-t-DEFAULT transition-colors placeholder:text-on-surface-variant/50" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-primary-container text-on-primary font-headline-md text-headline-md uppercase py-4 rounded-DEFAULT emerald-glow hover:bg-primary transition-all active:scale-95 flex justify-center items-center gap-2">
                    Get OTP
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
<div class="mt-6 text-center">
<p class="font-body-md text-body-md text-on-surface-variant/70 text-sm">By continuing, you agree to our <a class="text-primary hover:underline" href="#">Terms</a> &amp; <a class="text-primary hover:underline" href="#">Privacy Policy</a>.</p>
</div>
</div>
